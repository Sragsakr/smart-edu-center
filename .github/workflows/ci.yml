name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: saboraty_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d saboraty_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Migration safety
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:migrations
      - name: PostgreSQL 18 baseline validation
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host=127.0.0.1 --username=postgres --dbname=saboraty_ci --set=ON_ERROR_STOP=1 --file=postgres/baseline/0001_saboraty_clean_baseline.sql
          psql --host=127.0.0.1 --username=postgres --dbname=saboraty_ci --set=ON_ERROR_STOP=1 --file=postgres/baseline/0002_platform_identity_workflows.sql
          psql --host=127.0.0.1 --username=postgres --dbname=saboraty_ci --set=ON_ERROR_STOP=1 --tuples-only --no-align --file=postgres/validation/clean-baseline-smoke.sql | tee /tmp/saboraty-baseline-smoke.out
          if grep -Ev '^(t|0)?$' /tmp/saboraty-baseline-smoke.out | grep -q .; then
            echo "Unexpected PostgreSQL smoke output:"
            cat /tmp/saboraty-baseline-smoke.out
            exit 1
          fi
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: npm run check:secrets
      - name: Build
        run: npm run build
      - name: Client-secret scan
        run: npm run check:client-secrets

  deploy-production:
    name: Deploy production to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify production deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_TOKEN"
          curl --fail --show-error --silent \
            --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN"
